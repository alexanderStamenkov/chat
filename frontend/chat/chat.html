<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Чатче</title>
    <link rel="stylesheet" href="chat.css" />
  </head>

  <body>
    <div
      class="sidebar-overlay"
      id="sidebarOverlay"
      onclick="closeSidebar()"
    ></div>

    <div class="layout">
      <!-- SIDEBAR -->
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-wordmark">Чатче<span>.</span></span>
          <button class="logout-btn" onclick="handleLogout()" title="Изход">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </button>
        </div>

        <div class="sidebar-section">Разговори</div>
        <div class="users-list" id="users"></div>

        <div class="sidebar-footer">
          <div class="me-avatar" id="meAvatar">АЗ</div>
          <div class="me-info">
            <div class="me-email" id="meEmail">—</div>
            <div class="me-status">Онлайн</div>
          </div>
        </div>
      </div>

      <!-- CHAT -->
      <div class="chat">
        <!-- Empty state -->
        <div class="empty-state" id="emptyState">
          <div style="position: absolute; top: 14px; left: 16px">
            <button class="menu-btn" onclick="openSidebar()">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
              </svg>
            </button>
          </div>
          <div class="empty-icon">💬</div>
          <div class="empty-title">Избери разговор</div>
          <div class="empty-sub">Избери потребител от менюто вляво</div>
        </div>

        <!-- Active chat -->
        <div
          id="activeChat"
          style="display: none; flex-direction: column; flex: 1"
        >
          <div class="chat-header">
            <button class="menu-btn" onclick="openSidebar()">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
              </svg>
            </button>
            <div class="chat-header-avatar" id="chatAvatar"></div>
            <div>
              <div class="chat-header-name" id="chatName">—</div>
              <div class="chat-header-sub">онлайн</div>
            </div>
          </div>

          <div class="messages" id="messages"></div>

          <div class="input">
            <!-- Hidden file input -->
            <input
              type="file"
              id="imageInput"
              accept="image/*"
              style="display: none"
              onchange="handleImageUpload(event)"
            />

            <!-- Image upload button -->
            <button
              class="img-btn"
              onclick="document.getElementById('imageInput').click()"
              title="Прикачи снимка"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <polyline points="21 15 16 10 5 21" />
              </svg>
            </button>

            <div class="input-wrap">
              <input
                id="msgInput"
                placeholder="Напиши съобщение..."
                autocomplete="off"
              />
            </div>
            <button class="send-btn" onclick="sendMessage()">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="chat.js"></script>
  </body>
</html>
